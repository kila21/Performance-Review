specVersion: "4.0"
metadata:
  name: performance.review
type: application
framework:
  name: SAPUI5
  version: "1.154.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.codeeditor
    - name: sap.tnt
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
